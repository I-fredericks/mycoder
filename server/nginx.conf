## Put this file in /etc/nginx/conf.d/llama.conf
## 1) Replace CHANGE_ME_LONG_RANDOM with a long random key (openssl rand -hex 32)
## 2) Replace code.example.com with your domain, then run:
##       sudo certbot --nginx -d code.example.com     (adds HTTPS)
## The llama.cpp server itself only listens on 127.0.0.1:8080.

map $http_authorization $llama_api_ok {
    default                              0;
    "Bearer CHANGE_ME_LONG_RANDOM"       1;
}

server {
    listen 80;
    server_name code.example.com;

    location / {
        if ($llama_api_ok = 0) { return 401; }

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;          # needed for streaming tokens
        proxy_read_timeout 600s;      # CPU inference is slow
        client_max_body_size 4m;
    }
}
